# Copy to config.toml and adjust. Omitted keys fall back to built-in defaults.

device = "auto"                     # ADB serial, or "auto" to find the emulator
adb_path = ""                       # adb.exe; empty searches PATH, then the MuMu folder
package = "com.vinhomes.resident"
slots = ["18:00 - 19:00", "19:00 - 20:00"]  # one booking round per slot
subdivision = ""                    # "origami" or "bs"; "" = the account's
sport = "tennis"                    # tennis, multi, volleyball, table-tennis, basketball,
                                    # football, pickleball or badminton
court = "S10 - Sân tennis"          # as the app's court list names it
venue_keyword = "Origami"           # picks the venue when the app lists several
timeout = 30                        # longest wait for any screen, in seconds
max_swipes = 6                      # scroll attempts when a slot is hidden (short screens)

# Emulator start. Leave mumu_manager empty if you start the emulator yourself.
mumu_manager = "C:/Program Files/Netease/MuMuPlayer/nx_main/MuMuManager.exe"
mumu_index = 0                      # MuMu instance number (0 = first)
boot_timeout = 180                  # seconds to wait for Android and for the app
restart_app = true                  # restart the app for a clean state before booking

# Timed start: the scheduled task starts at wake_at and books at start_at.
start_at = "06:00"                  # when the app opens bookings, HH:MM or HH:MM:SS
wake_at = "05:45"                   # scheduled task time (court-booker schedule install)
ntp_server = "time.google.com"      # NTP time for the run; does not set Windows time; "" = PC clock
open_retry_seconds = 60             # keep reloading while the date or slot is not open yet
warm_up_seconds = 60                # wait on the home screen; open the utilities list this early
log_dir = "logs"                    # daily log files, next to this file; "" disables

# Optional: send the summary to Telegram. Create a bot with @BotFather, send it a
# message, then read your chat id from https://api.telegram.org/bot<token>/getUpdates
telegram_token = ""
telegram_chat_id = ""

# A Windows notification after every run, dry runs too; language "vi" or "en".
windows_notification = true
notification_language = "vi"

# Fallback points for the unlabelled calendar month buttons, as fractions of screen size:
# the middle of each button (measured at 540x1600). The driver clicks the button there.
next_month_xy = [0.930, 0.122]
prev_month_xy = [0.807, 0.122]

# Accessibility labels of the target app in Vietnamese; update them here if the app
# changes its wording. The English ones are built in: the booker finds the app's language
# when it opens the app.
[labels]
home = "Tiện ích"
utility = ""                        # the tile to tap; "" = the tile of sport
continue = "Tiếp tục"
confirm = "Xác nhận"
confirm_page = "Xác nhận đăng ký"   # unused since 0.6.2
prev_month = "Tháng trước"
next_month = "Tháng sau"
agree = "Tôi đã hiểu"
fully_booked = "Hết chỗ"
venue_list = "Chọn phân khu"         # heading of the venues, when the app lists them
court_list = "Chọn vị trí/dịch vụ"   # heading of the court list
residents = "Số lượng cư dân"        # caption of the booking details page
notice = "Thông báo"                 # title of the app's message dialogs
quota_full = "hết hạn mức"           # in the quota notice's message: the run stops there
booked_time = "Thời gian đặt lịch"   # caption of the date and slot to book
booked_place = "Vị trí/dịch vụ"      # caption of the court to book
ticket = "Chi tiết đặt lịch"         # title of the ticket: the booking went through
processing = "Đang xử lý"            # ticket status while the server handles it
registered = "Đã đăng ký"            # ticket status once registered

# Optional: more MuMu instances, each logged in to its own account, booking side by side
# with this one in a process of its own. Each table sets that instance's mumu_index and,
# if they differ from the settings above, its slots, subdivision, sport, court and
# venue_keyword.
# [[instances]]
# mumu_index = 1
# slots = ["20:00 - 21:00", "21:00 - 22:00"]
# sport = "badminton"
# court = "S6 - Sân cầu lông"
